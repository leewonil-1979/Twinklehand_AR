name: twinkle_hands_ar
description: TwinkleHands AR - 아이들이 재미있게 씻기를 배울 수 있는 AR 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core packages
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^16.2.1
  
  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.3.2
  
  # Camera & Media
  camera: ^0.11.2
  image: ^4.1.3
  gallery_saver: ^2.3.2
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # MediaPipe / ML Kit (choose one)
  # Option 1: Google ML Kit (Recommended)
  google_mlkit_pose_detection: ^0.14.0
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0
  
  # Option 2: MediaPipe (if available)
  # google_mediapipe: ^0.0.2
  
  # UI Enhancements
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  
  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  
  # Ads (Phase 4)
  google_mobile_ads: ^6.0.0
  
  # In-App Purchase (Phase 5)
  in_app_purchase: ^3.1.11
  
  # Analytics (Optional)
  # firebase_core: ^2.24.2
  # firebase_analytics: ^10.7.4
  # firebase_crashlytics: ^3.4.8
  
  # Audio (Optional)
  # audioplayers: ^5.2.1
  # just_audio: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  
  # Icons
  flutter_launcher_icons: ^0.14.4
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^10.0.0

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icons/app_icon.png"
  remove_alpha_ios: true

# Flutter Configuration
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/animations/
    - assets/sounds/
  
  # Fonts (Optional)
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: assets/fonts/Pretendard-Regular.otf
  #       - asset: assets/fonts/Pretendard-Bold.otf
  #         weight: 700
  #       - asset: assets/fonts/Pretendard-Light.otf
  #         weight: 300