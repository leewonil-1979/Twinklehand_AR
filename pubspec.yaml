name: twinklehands_ar
description: AR 손씻기 앱

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 카메라 기능
  camera: ^0.10.5
  
  # 권한 관리
  permission_handler: ^10.4.3
  
  # 파일 경로
  path_provider: ^2.0.15
  path: ^1.8.3
  
  # 광고
  google_mobile_ads: ^3.0.0
  
  # 앱내 결제
  in_app_purchase: ^3.1.8
  
  # 데이터 저장
  shared_preferences: ^2.1.1
  
  # 이미지 처리
  image: ^4.0.17
  
  # UI 아이콘
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# 앱에서 사용할 이미지들 등록
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/dirty-icons/
    - assets/images/clean-icons/
    - assets/images/app-icon.png